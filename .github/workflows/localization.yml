name: Localization

on:
  pull_request:
    paths:
      - "Frameworks/Resources/*.xcstrings"
      - "Scripts/normalize-string-catalogs.py"
      - "Scripts/check-localization.py"
      - ".github/workflows/localization.yml"
  push:
    branches: [main]
    paths:
      - "Frameworks/Resources/*.xcstrings"
      - "Scripts/normalize-string-catalogs.py"
      - "Scripts/check-localization.py"
      - ".github/workflows/localization.yml"

permissions:
  contents: read

jobs:
  catalogs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check catalog stability and translations
        run: python3 Scripts/check-localization.py
